# Roots for the Poorin prune. See docs/poorin/specs/2026-10-04-core-prune-design.md, "Roots".
# Code reachable from these roots is kept. A trailing ".*" selects every module under a package.

[[runnable]]
name = "R1"
module = "experiments.tutorials.train_tiny_model"
args = ["--device", "rtx5090x1", "--dataset", "wikitext", "--version", "dev", "--run"]

[[runnable]]
name = "R2"
module = "experiments.grug.base.launch"
args = ["--version", "dev", "--run"]

[kept]
modules = [
    # Scaling-law code
    "experiments.grug.fast_track.launch",
    "experiments.grug.fast_track.train",
    "experiments.grug.fast_track.model",
    "experiments.grug.fast_track.heuristic",
    "experiments.references.reference_scaling_suite",
    "experiments.tutorials.train_tiny_sweep",
    "marin.scaling_laws",
    "marin.experiment.cli",
    # Light post-training kit
    "levanter.main.train_dpo",
    "levanter.main.lora_lm",
    "levanter.main.lora_dpo",
    "levanter.main.sample_lm",
    # Serving and in-loop evaluation for Levanter models
    "levanter.inference.openai",
    "levanter.eval_harness",
    # Evaluation framework
    "marin.evaluation.evalchemy.*",
    "marin.evaluation.harbor.*",
    "marin.evaluation.lm_eval",
    "marin.evaluation.lm_eval_samples",
    "marin.evaluation.records",
    "marin.evaluation.rollouts",
    "marin.evaluation.eval_stats",
    "marin.evaluation.eval_measurements",
    "marin.evaluation.metric_selection",
    "marin.evaluation.evaluation_config",
    "marin.evaluation.model_config",
    "marin.evaluation.model_identity",
    "marin.evaluation.eval_env",
    "marin.evaluation.perplexity_gap",
    "marin.evaluation.trace_labeled_eval",
    # Plugin registry members: draccus finds these by name, so static imports do not reach them.
    "levanter.optim.*",
    "levanter.data.text.*",
    "levanter.tracker.tracker",
    "levanter.tracker.wandb",
    "levanter.tracker.json_logger",
    "levanter.tracker.json_file",
    "levanter.tracker.telemetry",
    "levanter.models.llama",
    # Poorin's own tooling: the prune must not delete it.
    "tools.*",
]
# Kept for reachability, not imported by prune_check: these run inside Harbor's isolated runtime,
# which provides the `harbor` package.
static_only = [
    "marin.evaluation.harbor.trial_driver",
    "marin.evaluation.harbor.single_turn_aime_agent",
]

[deleted]
# Deleted by Pass 1 regardless of reachability. Excluded from traversal, with their submodules.
modules = [
    "iris",
    "fray.iris_backend",
    "marin.rl",
    "marin.mcp",
    "marin.experiment.evaluation",
    "marin.evaluation.runner",
