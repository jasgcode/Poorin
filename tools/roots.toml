# Roots for the Poorin prune. See docs/poorin/specs/2026-10-04-core-prune-design.md, "Roots".
# Code reachable from these roots is kept. A trailing ".*" selects every module under a package.

[[runnable]]
name = "R1"
module = "experiments.tutorials.train_tiny_model"
args = ["--device", "rtx5090x1", "--dataset", "wikitext", "--version", "dev", "--run"]

[[runnable]]
name = "R2"
module = "experiments.grug.base.launch"
args = ["--version", "dev", "--run"]

[kept]
modules = [
    # Workbench: data preparation
    "poorin.experiment.data",
    "poorin.processing.tokenize.*",
    "poorin.datakit.download.huggingface",
    "poorin.datakit.download.nemotron_v1",
    "poorin.datakit.canonical.fineweb_edu",
    "poorin.datakit.normalize",
    "poorin.datakit.decon",
    "poorin.processing.classification.consolidate",
    "poorin.processing.classification.deduplication.exact",
    "poorin.processing.classification.deduplication.fuzzy_minhash",
    "poorin.processing.classification.deduplication.fuzzy_dups",
    "poorin.processing.classification.deduplication.verify_fuzzy_dups",
    "poorin.experiment.cli",
    "poorin.experiment.sweep",
    # Workbench: evaluation
    "levanter.main.eval_lm",
    "levanter.eval_harness",
    "levanter.main.perplexity_gap",
    "poorin.evaluation.lm_eval",
    "poorin.evaluation.records",
    "poorin.evaluation.eval_stats",
    "poorin.evaluation.eval_measurements",
    "poorin.evaluation.metric_selection",
    "poorin.evaluation.trace_labeled_eval",
    "poorin.evaluation.rollouts",
    "experiments.evals.task_configs",
    # Workbench: scaling laws and the Delphi recipe
    "poorin.scaling_laws",
    "poorin.scaling_laws.*",
    "experiments.references.completed_adamh",
    "experiments.grug.fast_track.heuristic",
    # Workbench: profiling. The profile-training skill runs it through lib/poorin/tools/profile_summary.py.
    "poorin.profiling.cli",
    # Light post-training kit (D9)
    "levanter.main.train_dpo",
    "levanter.main.lora_lm",
    "levanter.main.sample_lm",
    # Hooks for RL post-training through the owner's SkyRL fork (D68): Hugging Face export of
    # Levanter checkpoints, during training or after it, and Marin's chat template.
    "levanter.compat.hf_checkpoints",
    "levanter.main.export_lm_to_hf",
    "poorin.datakit.chat_template",
    "levanter.main.export_hf_to_lm",
    # Loaded by name or needed by kept tooling, so static imports do not reach them: pytest's
    # -p plugin, Zephyr's `python -m` shard runner, the fsutil CLI behind the use-fsutil skill,
    # and Finelog's in-process server for prune_check (D74).
    "poorin.pytest_timeout_guard",
    "zephyr.shard_subprocess",
    "rigging.fsutil.*",
    "finelog.embedded",
    # Loaded with importlib.import_module and a literal name: Marin's training launch helpers,
    # grug's segmented FA4 backward pass, and the QuACK kernel behind fast-track's stacked MuonH.
    "levanter.infra.cli_helpers",
    "levanter.grug.attention._fa4_cute_segmented_bwd",
    "levanter.grug._moe.quack_symmetric_cute",
    # Registered with fsspec by a dotted name; Levanter stages tokenizers through mirror://.
    "rigging.filesystem.mirror",
    # Plugin registry members: draccus finds these by name, so static imports do not reach them.
    "levanter.optim.*",
    "levanter.data.text.*",
    "levanter.tracker.tracker",
    "levanter.tracker.wandb",
    "levanter.tracker.json_logger",
    "levanter.tracker.json_file",
    "levanter.tracker.telemetry",
    "levanter.models.llama",
    # Poorin's own tooling: the prune must not delete it.
    "tools.*",
]
# No root needs to be importable only inside another tool's runtime any more.
static_only = []

[deleted]
# Deleted by Pass 1 regardless of reachability. Excluded from traversal, with their submodules.
modules = [
    "iris",
    "fray.iris_backend",
    # The 14 Levanter architectures the owner chose to delete
    "levanter.models.mistral",
    "levanter.models.mixtral",
    "levanter.models.gemma",
    "levanter.models.olmo",
    "levanter.models.olmo3",
    "levanter.models.whisper",
    "levanter.models.asr_model",
    "levanter.models.hyena",
    "levanter.models.gpt2_hyena",
    "levanter.models.modernbert",
    "levanter.models.apertus",
    "levanter.models.snowball",
    "levanter.models.qwen3_moe",
    "levanter.models.moe",
]
