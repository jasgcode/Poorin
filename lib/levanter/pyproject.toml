[build-system]
requires = ["uv_build>=0.7.19,<0.10.0"]
build-backend = "uv_build"

# Explicit module-name override because the dist name (marin-levanter) no
# longer matches the import name (levanter); uv_build's default would look
# for src/marin_levanter/ which doesn't exist.
[tool.uv.build-backend]
module-name = "levanter"

[project]
name = "marin-levanter"
version = "0.2.0"
description = "Scalable Training for Foundation Models with Named Tensors and JAX"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "David Hall", email = "dlwh@cs.stanford.edu" },
    { name = "Jason Wang", email = "jsywang@cs.stanford.edu" },
    { name = "Ahmed Ahmed" },
    { name = "Ivan Zhou", email = "ivanz@stanford.edu" },
    { name = "Will Held" },
    { name = "Virginia Adams" },
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "marin-finelog",
    "marin-finestore",
    "marin-haliax",
    "equinox>=0.11.7,!=0.12.0",
    "jax>=0.9.2,<0.12",
    "marin-fray",
    "marin-rigging",
    "marin-zephyr",
    "einops",
    "jaxtyping>=0.2.34",
    "tokenizers>=0.15.2",
    "transformers>=5.5.3,<6.0",
    "chex>=0.1.86",
    "optax>=0.1.9,<0.2.7",
    "wandb>0.24.0",
    "gitpython>=3.1.50",
    "draccus>=0.11.6",
    "pyarrow>=23.0.0",
    "zstandard>=0.18.0",
    "datasets>=3.1.0,<5.0",
    "gcsfs>=2024.2,<2027",
    "braceexpand>=0.1.7",
    "chex>=0.1.86",
    "jmp>=0.0.3",
    "fsspec[http]>=2024.2,<2027",
    "tensorstore>=0.1.82,<0.1.85",
    "pytimeparse>=1.1.8",
    "humanfriendly==10.0",
    "safetensors[numpy]>=0.4.2,<0.7.0",
    "tblib>=1.7.0,<4.0.0",
    "dataclasses-json~=0.6.4",
    "pydantic<3",
    "tqdm-loggable>=0.2",
    "deepdiff>=8.6.2",
    "jinja2",  # needed for apply_chat_template
    "protobuf>=6",
]

[project.urls]
Homepage = "https://github.com/stanford-crfm/levanter"
"Bug Tracker" = "https://github.com/stanford-crfm/levanter/issues"

[project.optional-dependencies]
gpu = [
  "jax[cuda13]==0.11.1",
  "nvidia-cublas>=13.2.0.9; sys_platform == 'linux'",
  "nvidia-nccl-cu13>=2.29.3; sys_platform == 'linux'",
  # FA4 CuTe/THD attention backends.
  "nvidia-cutlass-dsl[cu13]==4.6.2; sys_platform == 'linux'",
  "flash-attn-4[cu13]>=4.0.0b27,<4.1; sys_platform == 'linux'",
  # Fix the variable-length CLC scheduler's unobserved cancellation drain.
  # https://github.com/Dao-AILab/quack/commit/58cb592a1a6ef85a69e37d0b4eb50217b59d20ca
  "quack-kernels[cu13]==0.6.4; sys_platform == 'linux'",
  # QuACK's autotuner imports Triton without declaring it; the CUDA PyTorch wheel used to bring it.
  "triton>=3.6.0,<3.7; sys_platform == 'linux'",
]
tpu = ["jax==0.11.1", "jaxlib==0.11.1", "libtpu==0.0.46.*"]
torch_test = [
  "torch>=2.7.0",
  "peft>=0.12.0",
]
profiling = [
    "xprof",
  # TensorBoard UI for viewing traces and profiles
  "tensorboard>=2.16",
  # Writer used by the TensorBoard tracker implementation
  "tensorboardX>=2.6",
]
lm_eval = [
  "lm-eval@git+https://github.com/stanford-crfm/lm-evaluation-harness.git@d5e3391f22cde186c827674d5c3ec7c5f4fe0cab",
]


[dependency-groups]
test = [
  "pytest",
  "pytest-asyncio",
  "tensorboardX>=2.6",
  "chex>=0.1.86",
  "pytest-xdist",
  "trackio>=0.5.0",
]

docs = [
  "mkdocs>=1.4.3",
  "mkdocs-material>=7.3.3",
  "mkdocstrings>=0.22.0",
  "mkdocstrings-python>=1.1.2",
  "mkdocs-include-markdown-plugin",
  "pymdown-extensions",
  "pygments",
]

dev = [
  "pygments",
  "click>=8.0.0",
  "prompt_toolkit>=3.0.0",
]




[tool.uv]
conflicts = [
  [
    { extra = "gpu" },
    { extra = "tpu" },
  ],
]  # Never solve for both GPU and TPU at once

[tool.ruff]
line-length = 119
target-version = "py312"
extend-exclude = ["scripts/"]

[tool.ruff.lint]
# Mirror the root config's extra rules on top of ruff's default E/F set so they
# apply repo-wide: PLC0415 (no function-local imports), and the issue #6219
# local-import hygiene pair TID252 (absolute over parent-relative imports) and
# ICN001 (conventional import aliases, e.g. `import numpy as np`).
extend-select = ["PLC0415", "TID252", "ICN001"]
ignore = [
  "E203", "E501", "W605", "F821", "E266", "F722", "E731", "E741"
]

[tool.pytest.ini_options]
addopts = "-n auto -m 'not slow and not torch' --import-mode=importlib"
pythonpath = ["src", "tests"]
filterwarnings = [
    "ignore:Transparent hugepages are not enabled\\..*:UserWarning:jax._src.cloud_tpu_init",
    "ignore:Read the `app_url` setting from the appropriate Settings object\\.:DeprecationWarning:wandb.analytics.sentry",
    "ignore:websockets\\.legacy is deprecated.*:DeprecationWarning:websockets.legacy",
    "ignore:Passing 'msg' argument to Task\\.cancel\\(\\) is deprecated since Python 3\\.11, and scheduled for removal in Python 3\\.14\\.:DeprecationWarning",
    "ignore:Passing 'msg' argument to Future\\.cancel\\(\\) is deprecated since Python 3\\.11, and scheduled for removal in Python 3\\.14\\.:DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "torch: mark tests that use Torch (deselect with '-m \"not torch\"')",
]
asyncio_default_fixture_loop_scope = "function"
