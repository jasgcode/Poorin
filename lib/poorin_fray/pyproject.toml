[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poorin-fray"
version = "0.2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "humanfriendly>=10.0",
    "poorin-rigging",
]

[dependency-groups]
test = [
    "pytest-timeout",
    "pytest>=8.3.2",
    "pytest-xdist",
]
dev = [{ include-group = "test" }]

[tool.pytest.ini_options]
addopts = "-m 'not slow' --import-mode=importlib"
pythonpath = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/poorin_fray"]
