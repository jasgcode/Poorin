[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
requires-python = ">=3.12,<3.14"

[project]
name = "marin-core"
version = "0.2.0"

requires-python = ">=3.12"
dependencies = [
    # Provides the compression.zstd module that fsspec imports to register its
    # zstd codec on Python < 3.14; required for reading/writing zstd via fsspec.
    "backports-zstd>=1.0.0; python_version < '3.14'",
    "braceexpand",
    "datasets<5.0.0",
    "draccus>=0.11.6",
    "marin-fray",
    "marin-finestore",
    "marin-rigging",
    "fsspec>=2025.3.0",
    "gcsfs",
    "google-cloud-storage",
    "huggingface-hub",
    "marin-haliax",
    "jax>=0.9.2,<0.12",
    "jaxopt>=0.8.3",
    "marin-levanter",
    "transformers>=5.5.3,<6.0",
    "msgspec>=0.18.0",
    "numpy",
    "pandas>=2.0",
    "plotly",
    "pydantic<3",
    "pyarrow>=23.0.0",
    "regex",
    "requests>=2.33.0",
    "s3fs>=2024",
    "tqdm",
    "tqdm-loggable",
    "wandb>0.24.0",
    "marin-zephyr",
    "tokenizers",
]

[project.license]
file = "../../LICENSE"

[dependency-groups]
test = [
    "pytest>=8.3.2",
    "pytest-asyncio",
    "pytest-json-report>=1.5",
    "pytest-xdist",
    "pytest-timeout",
    # for scaling law plotting tests
    "plotly",
]
lint = [
    "ruff==0.14.3",
    "types-PyYAML",
    "types-requests",
    "click>=8.0",
    "pyyaml>=6.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings>=0.24.0",
    "mkdocstrings-python>=1.7.0",
    "pymdown-extensions>=10.0.0",
    "mkdocs-include-markdown-plugin>=7.1.5",
]

dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.uv]
conflicts = [
    [
        { extra = "gpu" },
        { extra = "tpu" },
    ],
    [
        { extra = "gpu" },
        { extra = "cpu" },
    ],
]


[project.optional-dependencies]

gpu = [
  "jax[cuda13]==0.11.1",
  "nvidia-cublas>=13.2.0.9; sys_platform == 'linux'",
  "nvidia-nccl-cu13>=2.29.3; sys_platform == 'linux'",
  # FA4 CuTe/THD attention backends.
  "nvidia-cutlass-dsl[cu13]==4.6.2; sys_platform == 'linux'",
  "flash-attn-4[cu13]>=4.0.0b27,<4.1; sys_platform == 'linux'",
  # Optional raw Sonic MoE gather/combine backend. Keep jax-triton exact:
  # 0.3.0 is missing the CUDA backend API needed by our current stack.
  "jax-triton==0.3.1; sys_platform == 'linux'",
  # This module imports Triton directly; stay on the tested minor without
  # forcing an exact patch version.
  "triton>=3.6.0,<3.7; sys_platform == 'linux'",
  "torch==2.11.0",
  "torchvision==0.26.0",
]
tpu = [
  "jax==0.11.1",
  "jaxlib==0.11.1",
  "libtpu==0.0.46.*",
  "torch==2.11.0",
  # Linux x86_64
  "torchvision==0.26.0+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # Windows x86_64 (AMD64)
  "torchvision==0.26.0+cpu; sys_platform == 'win32' and platform_machine == 'AMD64'",
  # Linux aarch64, macOS arm64: PyPI default wheel
  "torchvision==0.26.0; (sys_platform == 'linux' and platform_machine == 'aarch64') or (sys_platform == 'darwin' and platform_machine == 'arm64')",
]

cpu = [
  "jax==0.11.1",
  "torch==2.11.0",
  # Linux x86_64
  "torchvision==0.26.0+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # Windows x86_64 (AMD64)
  "torchvision==0.26.0+cpu; sys_platform == 'win32' and platform_machine == 'AMD64'",
  # Linux aarch64, macOS arm64: PyPI default wheel
  "torchvision==0.26.0; (sys_platform == 'linux' and platform_machine == 'aarch64') or (sys_platform == 'darwin' and platform_machine == 'arm64')",
]

dedup = [
    # Pure-Python workspace member; it pulls the native marin-dupekit-native
    # kernels transitively (see lib/dupekit/pyproject.toml).
    "marin-dupekit",
]

[tool.uv.sources]
torchvision = [
    # Default to the CPU index for TPU/CPU builds
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cpu", extra = "tpu" },
    # PyTorch cu130 pins an older cuBLAS than the B200 guard above allows.
    { index = "pytorch-cu128", extra = "gpu", marker = "sys_platform == 'linux'" },
]
torch = [
    # PyTorch cu130 pins an older cuBLAS than the B200 guard above allows.
    { index = "pytorch-cu128", extra = "gpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cpu", extra = "tpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/marin"]

[tool.hatch.build.targets.sdist]
packages = ["src/marin"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["marin"]
known-local-folder = []
