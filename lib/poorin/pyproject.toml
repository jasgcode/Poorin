[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poorin"
version = "0.2.0"

requires-python = ">=3.13"
dependencies = [
    # Provides the compression.zstd module that fsspec imports to register its
    # zstd codec on Python < 3.14; required for reading/writing zstd via fsspec.
    "backports-zstd>=1.0.0; python_version < '3.14'",
    "braceexpand",
    "datasets<5.0.0",
    "draccus>=0.11.6",
    "poorin-fray",
    "marin-finestore",
    "poorin-rigging",
    "fsspec>=2025.3.0",
    "gcsfs",
    "google-cloud-storage",
    "huggingface-hub",
    "marin-haliax",
    "jax>=0.9.2,<0.12",
    "jaxopt>=0.8.3",
    "marin-levanter",
    "transformers>=5.5.3,<6.0",
    "msgspec>=0.18.0",
    "numpy",
    "pandas>=2.0",
    "plotly",
    "pydantic<3",
    "pyarrow>=23.0.0",
    "regex",
    "requests>=2.33.0",
    "s3fs>=2024",
    "tqdm",
    "tqdm-loggable",
    "wandb>0.24.0",
    "marin-zephyr",
    "tokenizers",
]

[project.license]
file = "../../LICENSE"

[dependency-groups]
test = [
    "pytest>=8.3.2",
    "pytest-asyncio",
    "pytest-json-report>=1.5",
    "pytest-xdist",
    "pytest-timeout",
    # Runtime checker behind jaxtyping's import hook in the grug test suites.
    "beartype>=0.19",
    # for scaling law plotting tests
    "plotly",
]
lint = [
    "ruff==0.14.3",
    "types-PyYAML",
    "types-requests",
    "click>=8.0",
    "pyyaml>=6.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings>=0.24.0",
    "mkdocstrings-python>=1.7.0",
    "pymdown-extensions>=10.0.0",
    "mkdocs-include-markdown-plugin>=7.1.5",
]

dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.uv]
conflicts = [
    [
        { extra = "gpu" },
        { extra = "tpu" },
    ],
    [
        { extra = "gpu" },
        { extra = "cpu" },
    ],
]


[project.optional-dependencies]

gpu = [
  "jax[cuda13]==0.11.1",
  "nvidia-cublas>=13.2.0.9; sys_platform == 'linux'",
  "nvidia-nccl-cu13>=2.29.3; sys_platform == 'linux'",
  # FA4 CuTe/THD attention backends.
  "nvidia-cutlass-dsl[cu13]==4.6.2; sys_platform == 'linux'",
  # Exact: Levanter's segmented FA4 backward builds on FA4's CuTe internals, and 4.0.0b34's
  # backward preprocessing needs a newer CuTe DSL than nvidia-cutlass-dsl 4.6.2.
  "flash-attn-4[cu13]==4.0.0b28; sys_platform == 'linux'",
  "torch==2.11.0",
]
tpu = [
  "jax==0.11.1",
  "jaxlib==0.11.1",
  "libtpu==0.0.46.*",
  "torch==2.11.0",
]

cpu = [
  "jax==0.11.1",
  "torch==2.11.0",
]

dedup = [
    # Pure-Python workspace member; it pulls the native marin-dupekit-native
    # kernels transitively (see lib/dupekit/pyproject.toml).
    "marin-dupekit",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/poorin"]

[tool.hatch.build.targets.sdist]
packages = ["src/poorin"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["poorin"]
known-local-folder = []
