[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-finelog"
version = "0.2.11"
description = "Standalone log store + log service: structured-log ingest, query, and persistence."
requires-python = ">=3.12,<3.14"
# duckdb is used by the deploy CLI to query pulled parquet segments in-process
# (`finelog inspect`), not by a storage engine — the Rust server owns storage.
dependencies = [
    "marin-rigging",
    "click>=8.3.1",
    "connect-python>=0.9.0",
    "duckdb>=1.0.0",
    "fsspec>=2024.0.0",
    "gcsfs>=2024.0.0",
    "protobuf>=5.0",
    "pyarrow>=23.0.0",
    "pyyaml>=6.0",
    "zstandard>=0.22",
]

[dependency-groups]
test = [
    # The native in-process server (module `finelog_server`) is not a runtime dependency of the
    # client; the embedded-server test needs it. It is the published marin-finelog-server wheel.
    "httpx>=0.28.1",
    "marin-finelog-server==0.2.46.dev33324331711",
    "pytest>=8.4",
    "pytest-timeout",
    "pytest-xdist",
]
dev = [{ include-group = "test" }]

[tool.hatch.build.targets.sdist]
only-include = ["src/finelog", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/finelog"]

[tool.pytest.ini_options]
timeout = 10
timeout_method = "thread"
addopts = "-n auto --durations=25 -v --import-mode=importlib"
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]
log_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
