site_name: Poorin Documentation
site_description: Documentation for Poorin, a fork of Marin for local research training

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - search.highlight
    - search.share
    - search.suggest
    - content.code.annotation
    - content.code.copy
    - navigation.footer
  language: en
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      primary: black
      accent: white
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: black
      accent: white
  icon:
    repo: fontawesome/brands/git-alt
    edit: material/pencil
    view: material/eye
  logo: static/logo.png
  favicon: static/favicon.ico

repo_url: https://github.com/jasgcode/Poorin
repo_name: jasgcode/Poorin
edit_uri: edit/main/docs/

# Include extra JS to setup Read the Docs addons integrations
extra_javascript:
  - javascript/readthedocs.js

extra_css:
  - css/mkdocstrings.css
  - css/custom.css
  - css/friendly.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jasgcode/Poorin

watch:
  - docs/
  - lib/poorin/src/

# Specs, plans, and the decision log under docs/poorin/ link into the repository, not the site.
exclude_docs: |
  poorin/

nav:
  - Home: index.md
  - Tutorials:
      - Installation: tutorials/installation.md
      - First Experiment: tutorials/first-experiment.md
      - Setting up a Local GPU Environment: tutorials/local-gpu.md
      - Training an LM: tutorials/train-an-lm.md
  - Explanations:
      - The Language Modeling Pipeline: explanations/lm-pipeline.md
      - Evaluation: explanations/evaluation.md
      - Experiments: explanations/experiments.md
      - Lazy artifacts: explanations/lazy-artifacts.md
      - Episode datasets: explanations/episodes.md
      - Guidelines: explanations/guidelines.md
  - Developer Guide:
      - Development: dev-guide/development.md
      - Tutorial Guidelines: dev-guide/tutorial-guidelines.md
      - Building Docs: dev-guide/building-docs.md
  - Technical Reference:
      - Specifying Hardware Resources: references/resource-config.md
      - Default Steps: references/default-steps.md
      - Training Configuration: references/train-config.md
      - HBM Optimization: references/hbm-optimization.md
      - Browsing Buckets with fsutil: references/fsutil.md
      - Removed from Marin: references/removed-from-marin.md

markdown_extensions:
  - markdown.extensions.footnotes
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.arithmatex
  - pymdownx.emoji
  - pymdownx.tasklist
  - pymdownx.highlight:
      anchor_linenums: true
  - admonition
  - footnotes
  - attr_list
  - toc:
      permalink: true

plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'
      # min_search_length: 2
      # prebuild_index: true
      # # indexing: 'full'
      # properties:
      #     - title
      #     - tags
      #     - content
      #     - sections
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [".", "lib/poorin/src"]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://jax.readthedocs.io/en/latest/objects.inv
            - https://haliax.readthedocs.io/en/latest/objects.inv
            - https://levanter.readthedocs.io/en/latest/objects.inv
            - https://docs.kidger.site/equinox/objects.inv
            - https://einops.rocks/objects.inv
          options:
            annotations_path: brief
            ignore_init_summary: true
            docstring_style: google
            show_source: false
            docstring_section_style: list
            heading_level: 4
            inherited_members: true
            merge_init_into_class: false
            load_external_modules: true
            show_signature_annotations: true
            show_root_heading: true
            show_root_full_path: false
            show_bases: true
            show_submodules: true
            filters: ["!^_"]
            show_if_no_docstring: true
            show_symbol_type_heading: false
            show_symbol_type_toc: false
            show_category_heading: true
            members_order: source
            separate_signature: true
            line_length: 60
            signature_crossrefs: true

  - include-markdown
